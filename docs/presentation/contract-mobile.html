<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolScope contract witnesses</title><style>body{margin:0}svg{display:block;min-width:480px}.diagram-container{overflow-x:auto}</style><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" width="480" height="1080" viewBox="0 0 480 1080" role="img" aria-labelledby="contract-mobile-title contract-mobile-desc" font-family="Arial"><title id="contract-mobile-title">ToolScope synthetic contract change in both directions</title><desc id="contract-mobile-desc">An old millivolt call is rejected by the new input enum. A new warming result is rejected by the old ready-only consumer. Two other supplied examples remain accepted. These four examples do not prove universal compatibility.</desc><rect width="100%" height="100%" fill="#edf0f5"/>
<text x="28" y="40" font-size="13" fill="#076b61" font-weight="400">ToolScope / Inspect the contract, then test the example</text>
<text x="28" y="98" font-size="32" fill="#15232b" font-weight="700">One tool changed.</text>
<text x="28" y="145" font-size="26" fill="#15232b" font-weight="700">Two compatibility directions.</text>
<rect x="28" y="205" width="424" height="300" fill="white" stroke="#c6cdd8"/>
<text x="46" y="243" font-size="17" fill="#15232b" font-weight="700">Input: old caller → new server</text>
<text x="46" y="292" font-size="21" fill="#15232b" font-weight="400">Before: V, mV</text>
<text x="46" y="329" font-size="21" fill="#15232b" font-weight="400">After: V</text>
<text x="46" y="377" font-size="22" fill="#076b61" font-weight="700">{&quot;unit&quot;:&quot;mV&quot;}</text>
<text x="46" y="420" font-size="16" fill="#973c2e" font-weight="700">Accepted before. Rejected after.</text>
<text x="46" y="457" font-size="12" fill="#15232b" font-weight="400">/inputSchema/properties/unit</text>
<text x="46" y="481" font-size="12" fill="#15232b" font-weight="400">/enum/1</text>
<rect x="28" y="555" width="424" height="300" fill="white" stroke="#c6cdd8"/>
<text x="46" y="593" font-size="17" fill="#15232b" font-weight="700">Output: new server → old consumer</text>
<text x="46" y="642" font-size="21" fill="#15232b" font-weight="400">Before: ready</text>
<text x="46" y="679" font-size="21" fill="#15232b" font-weight="400">After: ready, warming</text>
<text x="46" y="727" font-size="22" fill="#076b61" font-weight="700">{&quot;status&quot;:&quot;warming&quot;}</text>
<text x="46" y="770" font-size="16" fill="#973c2e" font-weight="700">New result. Old consumer rejects it.</text>
<text x="46" y="807" font-size="12" fill="#15232b" font-weight="400">/outputSchema/properties/status</text>
<text x="46" y="831" font-size="12" fill="#15232b" font-weight="400">/enum/1</text>
<text x="28" y="949" font-size="19" fill="#076b61" font-weight="700">2 regressions. 2 accepted controls.</text>
<text x="28" y="991" font-size="14" fill="#15232b" font-weight="400">Exact advertised schemas and four supplied examples.</text>
<text x="28" y="1026" font-size="12" fill="#15232b" font-weight="400">Synthetic values, not sensor measurements or a security test.</text>
<text x="28" y="1057" font-size="12" fill="#15232b" font-weight="400">Finite witnesses; compatibilityProven remains false.</text>
</svg>
