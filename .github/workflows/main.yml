name: Verify ToolScope

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Install exact locked dependencies for root and all four clients
        run: |
          INSPECTOR_SKIP_CLIENT_INSTALL=1 npm ci
          npm --prefix clients/web ci
          npm --prefix clients/cli ci
          npm --prefix clients/tui ci
          npm --prefix clients/launcher ci
      - name: Validate guards, formatting, lint, types, builds, and unit tests
        run: npm run validate
      - name: Verify build safety gates
        run: |
          npm run verify:build-gate
          npm run verify:bundle-externals
      - name: Install Chromium for browser smoke and Storybook tests
        working-directory: clients/web
        run: npx playwright install --with-deps chromium
      - name: Exercise launcher, CLI, TUI, and web flows
        run: npm run smoke
      - name: Exercise Storybook interactions
        working-directory: clients/web
        run: npm run test:storybook

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Install exact locked dependencies for root and all four clients
        run: |
          INSPECTOR_SKIP_CLIENT_INSTALL=1 npm ci
          npm --prefix clients/web ci
          npm --prefix clients/cli ci
          npm --prefix clients/tui ci
          npm --prefix clients/launcher ci
      - name: Enforce per-file 90 percent coverage for web, CLI, TUI, and launcher
        run: npm run coverage
