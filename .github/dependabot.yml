version: 2
updates:
  - package-ecosystem: npm
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      shared-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name
    directories:
      - /
      - /clients/web
      - /clients/cli
      - /clients/tui
      - /clients/launcher
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
